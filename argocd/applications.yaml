---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nick-draper/kustomize-application.git
    targetRevision: main
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
