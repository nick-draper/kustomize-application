---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  # The example Job runs registry.k8s.io/pause and does not exit. Argo CD
  # otherwise waits forever at sync wave 76 and never applies the CronJob.
  resource.customizations.health.batch_Job: |
    hs = {}
    if obj.status ~= nil and obj.status.active ~= nil and obj.status.active > 0 then
      hs.status = "Healthy"
      hs.message = "Job is running"
      return hs
    end
    if obj.status ~= nil and obj.status.succeeded ~= nil and obj.status.succeeded > 0 then
      hs.status = "Healthy"
      hs.message = "Job succeeded"
      return hs
    end
    hs.status = "Progressing"
    hs.message = "Waiting for the Job pod"
    return hs
