---
apiVersion: batch/v1
kind: Job

metadata:
  name: example-job
  labels:
    scheduling.my.cluster/compute: cpu

spec:
  template:
    metadata:
      labels:
        app: example
    spec:
      restartPolicy: Never
      containers:
        - name: example
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
...
