---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: example-deployment
  labels:
    scheduling.my.cluster/compute: gpu

spec:
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      containers:
        - name: example
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
...
